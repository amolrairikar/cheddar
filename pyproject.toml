[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheddar"
version = "0.1.0"
description = "Local-first personal finance app driven by parsed emails"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32"]

[project.optional-dependencies]
dev = ["httpx2", "pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["api", "tests/loading"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["api"]

[tool.coverage.report]
# With branch coverage on, 100% total requires every line AND every branch covered.
fail_under = 100
show_missing = true
